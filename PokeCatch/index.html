<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pokecatch</title>
  </head>
  <body>
    <div id="app"></div>
    <p id="error"></p>
    <p id="success"></p>

    <form id="capture-form">
      <h1>Catch Pokemon</h1>
      <div>
        <label for="name">Name</label>
        <input type="text" id="name" name="name">
      </div>
      <div>
        <label for="types">Types</label>
        <input type="text" id="types" name="types">
      </div>
      <div>
        <label for="isFavorite">Favorite</label>
        <input type="checkbox" id="isFavorite" name="isFavorite">
      </div>
      <button type="submit">Capture</button>
    </form>

    <button id="discover-button">Discover Pokémon</button>

    <ul id="discovered-list"></ul>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
